services:
  postgres:
    image: postgres:16-alpine
    container_name: trust_postgres
    environment:
      POSTGRES_DB: trust_platform
      POSTGRES_USER: trust_user
      POSTGRES_PASSWORD: trust_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trust_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: